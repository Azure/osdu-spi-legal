variables:
  CIMPL_SERVICE: legal
  CIMPL_LEGALSTATUS_IMAGE_NAME: cimpl-legal-status-update
  DISABLE_INTEGRATION_TEST: true

cimpl-containerize-cronjob-gitlab:
  extends: cimpl-containerize-gitlab
  variables:
    CIMPL_IMAGE_NAME: "$CIMPL_LEGALSTATUS_IMAGE_NAME"
    CIMPL_BUILD_PATH: "devops/core-plus/bootstrap_legalstatus_update/Dockerfile"

cimpl-helm-charts-gitlab:
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_set_legalstatus_image_name, script]
    - !reference [.cimpl_substitute_image_in_helm, script]
    - !reference [.cimpl_substitute_legalstatus_image, script]

cimpl-helm-charts-release-gitlab:
  before_script:
    - helm registry login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - !reference [.cimpl_set_image_name, script]
    - !reference [.cimpl_set_legalstatus_image_name, script]
    - !reference [.cimpl_substitute_image_in_helm, script]
    - !reference [.cimpl_substitute_legalstatus_image, script]

# Appends branch suffix to CIMPL_LEGALSTATUS_IMAGE_NAME, mirroring the
# release/master branches of .cimpl_set_image_name for the third image legal
# manages. Tag builds use the tag directly via IMAGE_TAG, no suffix needed.
.cimpl_set_legalstatus_image_name:
  script:
    - >
      if echo $CI_COMMIT_REF_NAME | grep -Eq "^release\/[0-9]{1,2}.[0-9]{1,2}$";
      then
        export CIMPL_LEGALSTATUS_IMAGE_NAME=$CIMPL_LEGALSTATUS_IMAGE_NAME-release;
      fi
    - >
      if [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]];
      then
        export CIMPL_LEGALSTATUS_IMAGE_NAME=$CIMPL_LEGALSTATUS_IMAGE_NAME-master;
      fi

# Writes legalStatusUpdateImage to values.yaml. Must run after
# .cimpl_substitute_image_in_helm which installs yq.
.cimpl_substitute_legalstatus_image:
  script:
    - LEGALSTATUS_UPDATE_IMAGE="$CI_REGISTRY_IMAGE/$CIMPL_LEGALSTATUS_IMAGE_NAME:${CHART_IMAGE_TAG:-$IMAGE_TAG}" yq -i '.data.legalStatusUpdateImage = env(LEGALSTATUS_UPDATE_IMAGE)' $CIMPL_HELM_DEPLOYMENT_DIR/values.yaml

# os-core-test 0.2.0 GetInfoAssertions gates feature-flag checks on
# EXPOSE_FEATUREFLAG_ENABLED. The deployed legal service exposes feature flags,
# so the acceptance test must expect them (otherwise asserts null vs the live
# FeatureFlagState list). Same fix applied to storage.
cimpl-dev-acceptance-test:
  variables:
    EXPOSE_FEATUREFLAG_ENABLED: "true"

cimpl-dev-backup-acceptance-test:
  variables:
    EXPOSE_FEATUREFLAG_ENABLED: "true"

cimpl-prod-acceptance-test:
  variables:
    EXPOSE_FEATUREFLAG_ENABLED: "true"
